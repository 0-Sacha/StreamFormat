name: StreamFormat

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  windows-latest-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bazelbuild/setup-bazelisk@v3
    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/bazel"
        key: bazel
    - name: Building...
      run: bazelisk build //:StreamFormatTests
    - name: Testing...
      run: bazelisk test //:StreamFormatTests
      
  windows-latest-winlibs:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bazelbuild/setup-bazelisk@v3
    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/bazel"
        key: bazel
    - name: Build Winlibs/clang...
      run: bazelisk build --config=winlibs-clang //:StreamFormatTests
    - name: Test Winlibs/clang...
      run: bazel-bin/StreamFormatTests.exe
    - name: Build Winlibs/gcc...
      run: bazelisk build --config=winlibs-gcc //:StreamFormatTests

  ubuntu-latest-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bazelbuild/setup-bazelisk@v3
    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/bazel"
        key: bazel
    - name: Version
      run: gcc --version
    - name: Building...
      run: CC=gcc bazelisk build //:StreamFormatTests
    - name: Testing... (W asan)
      run: CC=gcc bazelisk test --features=asan //:StreamFormatTests

  ubuntu-latest-clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bazelbuild/setup-bazelisk@v3
    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/bazel"
        key: bazel
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x ./llvm.sh
        sudo ./llvm.sh 17
    - name: Version
      run: clang++-17 --version
    - name: Building...
      run: CC=clang++-17 bazelisk build //:StreamFormatTests
    - name: Testing... (W asan)
      run: CC=clang++-17 bazelisk test --features=asan //:StreamFormatTests
